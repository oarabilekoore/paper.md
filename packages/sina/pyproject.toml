[project]
name = "sina"
version = "0.1.0"
description = "A simple backend and frontend that provide neccesary tools to train,benchmark,modify db tables, scan documents and create synthetic data"

readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "imagehash>=4.3.2",
    "numpy>=2.5.0",
    "pillow>=12.2.0",
    "uvicorn>=0.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
